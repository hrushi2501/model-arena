name: model-arena

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-model_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-model_arena}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-model_arena}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: ./infra/mlflow
      dockerfile: Dockerfile
    command:
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlartifacts/mlflow.db
      - --artifacts-destination
      - /mlartifacts
      - --allowed-hosts
      - mlflow:5000,localhost:5001,127.0.0.1:5001
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:5000/health', headers={'Host': 'mlflow:5000'}))"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-api:
    build:
      context: ./backend/control_api
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-model_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-model_arena}
      CHAMPION_MODEL_URI: ${CHAMPION_MODEL_URI:-models:/wine-classifier/1}
      CANDIDATE_MODEL_URI: ${CANDIDATE_MODEL_URI:-models:/wine-classifier/2}
      ENABLE_DEMO_FAULTS: ${ENABLE_DEMO_FAULTS:-false}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-model_arena}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend/worker
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-model_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-model_arena}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-model_arena}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
      CANDIDATE_URL: http://model-candidate:8000
      CANDIDATE_MODEL_URI: ${CANDIDATE_MODEL_URI:-models:/wine-classifier/2}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  model-champion:
    build:
      context: ./backend/model_serving
      dockerfile: Dockerfile
    environment:
      MODEL_ROLE: champion
      MODEL_URI: ${CHAMPION_MODEL_URI:-models:/wine-classifier/1}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    expose:
      - "8000"
    profiles: ["serving"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      mlflow:
        condition: service_healthy

  model-candidate:
    build:
      context: ./backend/model_serving
      dockerfile: Dockerfile
    environment:
      MODEL_ROLE: candidate
      MODEL_URI: ${CANDIDATE_MODEL_URI:-models:/wine-classifier/2}
      ENABLE_DEMO_FAULTS: ${ENABLE_DEMO_FAULTS:-false}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    expose:
      - "8000"
    profiles: ["serving"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      mlflow:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-api:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  mlflow_artifacts:
