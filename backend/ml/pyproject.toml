[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "model-arena-training"
version = "0.1.0"
description = "DVC training pipeline and MLflow registration helpers for Model Arena"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dvc>=3,<4",
  "mlflow>=3,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = ["ruff>=0.11,<1"]
